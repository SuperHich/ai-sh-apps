<!--
  MODÈLE — page d'histoire du Grenier des Apps
  Copier dans stories/<categorie>/<slug>.html puis remplacer les {{...}}.
  Tout est vanilla : un seul fichier, aucune image binaire, illustrations en SVG inline.
  Catégorie « arabe » : <html lang="ar" dir="rtl"> et <back-button ... rtl>.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{Titre}} – {{Sous-titre}}</title>
<!-- Icône d'onglet du Grenier : chemin depuis stories/<categorie>/. -->
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="mask-icon" href="../../assets/favicon-mono.svg" color="#f0c04b">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  :root {
    /* palette propre à l'histoire — 3 à 5 teintes + fonds sombres */
    --accent:{{#d4a020}};
    --accent2:{{#2a8a7a}};
    --sable:#f0e4c0;
    --encre:#080608;
    --dark:#0a080e;
    --dark2:#0c0a12;
    --serif:'EB Garamond','Georgia',serif;
    --display:'Cinzel','Trajan Pro',serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--encre);color:var(--sable);
    font-family:var(--serif);font-size:1.15em;line-height:1.8;
    scroll-snap-type:y proximity;overflow-y:scroll;height:100vh;
  }
  section{
    min-height:100vh;scroll-snap-align:start;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 24px;position:relative;overflow:hidden;
  }
  section.dark{background:var(--dark);}
  section.dark2{background:var(--dark2);}
  section.hero-bg{
    background:
      radial-gradient(ellipse at 50% 60%,rgba(212,160,32,.35) 0%,transparent 65%),
      var(--dark);
  }
  .divider{width:120px;height:1px;background:linear-gradient(to right,transparent,var(--accent),transparent);margin:26px auto;}

  .hero-sec{text-align:center;}
  h1{
    font-family:var(--display);font-size:clamp(2em,6vw,4.6em);font-weight:800;
    line-height:1.1;text-transform:uppercase;letter-spacing:2px;
    background:linear-gradient(155deg,var(--sable) 20%,var(--accent) 55%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;
  }
  .sub{font-family:var(--display);font-size:clamp(.8em,2vw,.96em);color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:22px;}
  .tagline{font-style:italic;color:rgba(240,228,192,.52);font-size:1.18em;max-width:520px;margin:0 auto 38px;}
  .scroll-cue{font-family:var(--display);font-size:.75em;letter-spacing:4px;text-transform:uppercase;color:rgba(212,160,32,.6);animation:pulse 2.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;transform:translateY(0);}50%{opacity:.85;transform:translateY(7px);}}

  .chapter{max-width:680px;width:100%;text-align:center;}
  .chapter-num{font-family:var(--display);font-size:.75em;letter-spacing:5px;color:var(--accent2);text-transform:uppercase;margin-bottom:12px;display:block;}
  h2{font-family:var(--display);font-size:clamp(1.4em,3.8vw,2.2em);font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:26px;}
  p{text-align:justify;color:rgba(240,228,192,.83);font-size:1.04em;margin-bottom:14px;}
  blockquote{border-left:3px solid var(--accent);margin:26px 0;padding:14px 24px;text-align:left;background:rgba(212,160,32,.05);border-radius:0 4px 4px 0;}
  blockquote p{font-style:italic;font-size:1.14em;margin:0;}
  strong{color:var(--sable);font-weight:600;}
  em{color:var(--accent);font-style:italic;}

  .illus{width:100%;max-width:640px;margin:0 auto 34px;border-radius:6px;overflow:hidden;}
  .illus svg{display:block;width:100%;}

  .ending{text-align:center;}
  .ending .ornament{font-size:2em;color:var(--accent);display:block;margin-bottom:22px;letter-spacing:12px;}
  .ending .moral{font-style:italic;font-size:1.18em;color:rgba(240,228,192,.72);max-width:560px;margin:0 auto 24px;}

  @media(max-width:600px){section{padding:50px 16px;}h1{font-size:2em;}}
  @media(prefers-reduced-motion:reduce){.scroll-cue{animation:none;}}
</style>
</head>
<body>

<!-- ÉTAPE 2 — bouton retour, identique aux autres histoires de la catégorie -->
<script src="../../components/back-button.js"></script>
<back-button href="index.html"></back-button>

<!-- ══ HERO ══ -->
<section class="hero-bg hero-sec">
  <div class="illus">
    <svg viewBox="0 0 580 200" xmlns="http://www.w3.org/2000/svg">
      <!-- illustration d'ouverture : dégradés + formes, ids préfixés par le slug -->
      <rect width="580" height="200" fill="#06040c"/>
    </svg>
  </div>
  <h1>{{Titre}}</h1>
  <div class="sub">{{Sous-titre}}</div>
  <div class="divider"></div>
  <p class="tagline">{{Accroche en une phrase}}</p>
  <div class="scroll-cue">↓ Faire défiler ↓</div>
</section>

<!-- ══ CHAPITRE — dupliquer autant de fois que de chapitres ══ -->
<section class="dark">
  <div class="chapter">
    <span class="chapter-num">Chapitre I</span>
    <h2>{{Titre du chapitre}}</h2>
    <div class="illus">
      <svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg"><!-- … --></svg>
    </div>
    <p>{{Récit — phrases courtes, ton narratif, adapté aux enfants.}}</p>
    <blockquote><p>{{Citation ou parole marquante.}}</p></blockquote>
  </div>
</section>

<!-- ══ FIN ══ -->
<section class="dark2 ending">
  <span class="ornament">✦ ✦ ✦</span>
  <p class="moral">{{Morale de l'histoire.}}</p>
  <div class="divider"></div>
</section>

</body>
</html>
