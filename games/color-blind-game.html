<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Color Blind!</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0b1a;
  --panel: #16122a;
  --border: rgba(255,255,255,0.07);
  --ink: #f0ecff;
  --muted: rgba(240,236,255,0.45);
  --red:    #ff3d5a;
  --blue:   #3d9fff;
  --green:  #3dff8f;
  --yellow: #ffe03d;
  --purple: #c43dff;
  --orange: #ff8c3d;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

/* Grid bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* Glow blob */
body::after {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(196,61,255,0.08) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 1rem 1.2rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

/* ===== HEADER ===== */
h1 {
  font-family: 'Black Han Sans', sans-serif;
  font-size: clamp(2rem, 7vw, 2.8rem);
  color: var(--ink);
  letter-spacing: 2px;
  text-align: center;
  line-height: 1;
}
h1 em {
  font-style: normal;
  background: linear-gradient(90deg, var(--purple), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
  text-align: center;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ===== HUD ===== */
.hud {
  display: flex;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  gap: 0.6rem;
}

.hud-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0.5rem 1rem;
  text-align: center;
  flex: 1;
}
.hud-label {
  font-size: 0.62rem;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
}
.hud-val {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.6rem;
  color: var(--ink);
  line-height: 1;
}
.hud-val.score-val { color: var(--yellow); }

/* ===== TIMER BAR ===== */
.timer-bar-wrap {
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
}
.timer-bar {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--purple), var(--blue));
  transition: width 0.1s linear, background 0.3s;
  width: 100%;
}

/* ===== WORD CARD ===== */
.word-card {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 140px;
  position: relative;
  overflow: hidden;
}

.word-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%);
  pointer-events: none;
}

.word-instruction {
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}

.word-text {
  font-family: 'Black Han Sans', sans-serif;
  font-size: clamp(3rem, 14vw, 5rem);
  letter-spacing: 3px;
  line-height: 1;
  transition: all 0.08s;
}

/* idle state */
.word-card.idle .word-text {
  color: rgba(240,236,255,0.15);
}

/* ===== COLOR BUTTONS ===== */
.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  width: 100%;
}

.color-btn {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 2px;
  padding: 0.9em 0;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  color: white;
  transition: transform 0.07s, box-shadow 0.07s, filter 0.15s;
  position: relative;
  overflow: hidden;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.color-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
  border-radius: 18px;
}

.color-btn:active { transform: scale(0.94); }
.color-btn:disabled { filter: brightness(0.35); cursor: not-allowed; }

.color-btn.RED    { background: var(--red);    box-shadow: 0 6px 0 #8a0020, 0 8px 20px rgba(255,61,90,0.3); }
.color-btn.BLUE   { background: var(--blue);   box-shadow: 0 6px 0 #0048a0, 0 8px 20px rgba(61,159,255,0.3); }
.color-btn.GREEN  { background: var(--green);  box-shadow: 0 6px 0 #006a30, 0 8px 20px rgba(61,255,143,0.3); color: #002a14; text-shadow: none; }
.color-btn.YELLOW { background: var(--yellow); box-shadow: 0 6px 0 #a07000, 0 8px 20px rgba(255,224,61,0.3); color: #3a2800; text-shadow: none; }
.color-btn.PURPLE { background: var(--purple); box-shadow: 0 6px 0 #5a00a0, 0 8px 20px rgba(196,61,255,0.3); }
.color-btn.ORANGE { background: var(--orange); box-shadow: 0 6px 0 #8a3a00, 0 8px 20px rgba(255,140,61,0.3); }

.color-btn:active {
  transform: translateY(4px) scale(0.97);
  box-shadow: 0 2px 0 rgba(0,0,0,0.4) !important;
}

/* Flash feedback */
@keyframes flashCorrect {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.6) saturate(1.3); }
}
@keyframes flashWrong {
  0%,100% { filter: brightness(1); }
  30% { filter: brightness(2) hue-rotate(180deg); }
}
.color-btn.flash-correct { animation: flashCorrect 0.25s ease; }
.color-btn.flash-wrong   { animation: flashWrong 0.3s ease; }

/* ===== FEEDBACK FLASH OVERLAY ===== */
.flash-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 50;
}
@keyframes overlayCorrect { 0% { opacity:0.18; } 100% { opacity:0; } }
@keyframes overlayWrong   { 0% { opacity:0.30; } 100% { opacity:0; } }
.flash-overlay.correct { background: var(--green); animation: overlayCorrect 0.3s ease forwards; }
.flash-overlay.wrong   { background: var(--red);   animation: overlayWrong 0.35s ease forwards; }

/* ===== COMBO ===== */
.combo {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1rem;
  letter-spacing: 2px;
  color: var(--yellow);
  height: 1.4em;
  text-align: center;
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.2s, transform 0.2s;
}
.combo.show { opacity: 1; transform: scale(1); }

/* ===== START / RESULT SCREEN ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(14,11,26,0.92);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: all; }

.overlay-box {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px;
  padding: 2.2rem 2.5rem;
  text-align: center;
  max-width: 340px;
  width: 88vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.7rem;
  transform: scale(0.85);
  transition: transform 0.4s cubic-bezier(.22,1,.36,1);
}
.overlay.show .overlay-box { transform: scale(1); }

.ov-emoji { font-size: 4rem; line-height: 1; }
.ov-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 2rem;
  letter-spacing: 3px;
  color: var(--ink);
}
.ov-sub { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
.ov-score {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 3rem;
  color: var(--yellow);
  line-height: 1;
}
.ov-score-label { font-size: 0.75rem; font-weight: 900; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

.ov-btn {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: white;
  border: none;
  border-radius: 14px;
  padding: 0.7em 2.2em;
  cursor: pointer;
  margin-top: 0.5rem;
  box-shadow: 0 5px 20px rgba(196,61,255,0.35);
  transition: transform 0.07s, box-shadow 0.07s;
}
.ov-btn:active { transform: translateY(3px); box-shadow: 0 2px 8px rgba(196,61,255,0.2); }

/* Best */
.ov-best { font-size: 0.78rem; font-weight: 900; color: var(--yellow); letter-spacing: 1px; }
</style>
</head>
<body>

<script src="../components/back-button.js"></script>
<back-button href="../index.html" label="Accueil"></back-button>

<div class="flash-overlay" id="flashOverlay"></div>

<div class="wrap">
  <h1>Color <em>Blind</em> 🎨</h1>
  <p class="subtitle">Tap the COLOR of the word — not what it says!</p>

  <div class="hud">
    <div class="hud-box">
      <span class="hud-label">Score</span>
      <span class="hud-val score-val" id="scoreEl">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">Streak</span>
      <span class="hud-val" id="streakEl">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">Best</span>
      <span class="hud-val" id="bestEl">0</span>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="word-card idle" id="wordCard">
    <div class="word-instruction">What COLOR is this word?</div>
    <div class="word-text" id="wordText">READY</div>
  </div>

  <div class="combo" id="comboEl"></div>

  <div class="btn-grid" id="btnGrid">
    <button class="color-btn RED"    onclick="guess('RED')"    disabled>RED</button>
    <button class="color-btn BLUE"   onclick="guess('BLUE')"   disabled>BLUE</button>
    <button class="color-btn GREEN"  onclick="guess('GREEN')"  disabled>GREEN</button>
    <button class="color-btn YELLOW" onclick="guess('YELLOW')" disabled>YELLOW</button>
    <button class="color-btn PURPLE" onclick="guess('PURPLE')" disabled>PURPLE</button>
    <button class="color-btn ORANGE" onclick="guess('ORANGE')" disabled>ORANGE</button>
  </div>
</div>

<!-- Overlay -->
<div class="overlay show" id="overlay">
  <div class="overlay-box">
    <div class="ov-emoji" id="ovEmoji">🎨</div>
    <div class="ov-title" id="ovTitle">COLOR BLIND</div>
    <div class="ov-sub" id="ovSub">Tap the COLOR — not the word.<br>30 seconds. Go!</div>
    <div class="ov-score" id="ovScore" style="display:none"></div>
    <div class="ov-score-label" id="ovScoreLabel" style="display:none"></div>
    <div class="ov-best" id="ovBest" style="display:none"></div>
    <button class="ov-btn" id="ovBtn" onclick="startGame()">▶ START</button>
  </div>
</div>

<script>
const COLORS = ['RED','BLUE','GREEN','YELLOW','PURPLE','ORANGE'];
const COLOR_CSS = {
  RED:'#ff3d5a', BLUE:'#3d9fff', GREEN:'#3dff8f',
  YELLOW:'#ffe03d', PURPLE:'#c43dff', ORANGE:'#ff8c3d'
};
const ROUND_MS = 30000;
const POINTS_CORRECT = 10;
const POINTS_WRONG   = -5;

let score = 0, streak = 0, bestScore = 0;
let currentColor = ''; // the INK color (answer)
let currentWord  = ''; // the TEXT shown
let timerRaf, startMs, running = false;

const wordCard  = document.getElementById('wordCard');
const wordText  = document.getElementById('wordText');
const scoreEl   = document.getElementById('scoreEl');
const streakEl  = document.getElementById('streakEl');
const bestEl    = document.getElementById('bestEl');
const timerBar  = document.getElementById('timerBar');
const comboEl   = document.getElementById('comboEl');
const overlay   = document.getElementById('overlay');
const flashOv   = document.getElementById('flashOverlay');
const buttons   = document.querySelectorAll('.color-btn');

function loadBest() { try { bestScore = parseInt(localStorage.getItem('cb_best')||'0')||0; } catch(e){} }
function saveBest() { try { localStorage.setItem('cb_best', String(bestScore)); } catch(e){} }

function startGame() {
  overlay.classList.remove('show');
  score = 0; streak = 0; running = true;
  updateHUD();
  setButtons(true);
  wordCard.classList.remove('idle');
  nextWord();
  startMs = performance.now();
  runTimer();
}

function runTimer() {
  function tick() {
    if (!running) return;
    const elapsed = performance.now() - startMs;
    const pct = Math.max(0, 1 - elapsed / ROUND_MS);
    timerBar.style.width = (pct * 100) + '%';
    // Color shifts red as time runs out
    const hue = Math.round(pct * 260); // 260=blue → 0=red
    timerBar.style.background = `hsl(${hue}, 90%, 60%)`;
    if (elapsed >= ROUND_MS) { endGame(); return; }
    timerRaf = requestAnimationFrame(tick);
  }
  timerRaf = requestAnimationFrame(tick);
}

function nextWord() {
  // Pick a random ink color and a DIFFERENT word
  currentColor = COLORS[Math.floor(Math.random() * COLORS.length)];
  // Word is always different from ink color (that's the trick!)
  let wordColors = COLORS.filter(c => c !== currentColor);
  currentWord  = wordColors[Math.floor(Math.random() * wordColors.length)];
  wordText.textContent = currentWord;
  wordText.style.color = COLOR_CSS[currentColor];

  // Animate in
  wordText.style.transform = 'scale(0.7)';
  wordText.style.opacity   = '0';
  requestAnimationFrame(() => {
    wordText.style.transition = 'transform 0.18s cubic-bezier(.22,1,.36,1), opacity 0.15s';
    wordText.style.transform  = 'scale(1)';
    wordText.style.opacity    = '1';
  });
}

function guess(color) {
  if (!running) return;
  const correct = color === currentColor;

  if (correct) {
    score += POINTS_CORRECT + (streak >= 3 ? 5 : 0); // bonus for streak
    streak++;
    showFlash('correct');
    if (streak >= 3) showCombo();
  } else {
    score = Math.max(0, score + POINTS_WRONG);
    streak = 0;
    showFlash('wrong');
    hideCombo();
    // Flash the wrong button
    const wrongBtn = document.querySelector(`.color-btn.${color}`);
    if (wrongBtn) {
      wrongBtn.classList.add('flash-wrong');
      wrongBtn.addEventListener('animationend', () => wrongBtn.classList.remove('flash-wrong'), { once: true });
    }
  }

  updateHUD();
  nextWord();
}

function showFlash(type) {
  flashOv.className = 'flash-overlay ' + type;
  flashOv.addEventListener('animationend', () => flashOv.className = 'flash-overlay', { once: true });
}

function showCombo() {
  const msgs = ['🔥 COMBO!', '🔥🔥 ON FIRE!', '⚡ UNSTOPPABLE!', '🧠 GENIUS!'];
  comboEl.textContent = msgs[Math.min(streak - 3, msgs.length - 1)];
  comboEl.classList.add('show');
}
function hideCombo() {
  comboEl.classList.remove('show');
}

function updateHUD() {
  scoreEl.textContent  = score;
  streakEl.textContent = streak;
  bestEl.textContent   = Math.max(score, bestScore);
}

function setButtons(enabled) {
  buttons.forEach(b => b.disabled = !enabled);
}

function endGame() {
  running = false;
  cancelAnimationFrame(timerRaf);
  setButtons(false);
  timerBar.style.width = '0%';
  wordCard.classList.add('idle');
  wordText.textContent = 'TIME!';
  wordText.style.color = '';

  if (score > bestScore) { bestScore = score; saveBest(); }

  const ovEmoji      = document.getElementById('ovEmoji');
  const ovTitle      = document.getElementById('ovTitle');
  const ovSub        = document.getElementById('ovSub');
  const ovScore      = document.getElementById('ovScore');
  const ovScoreLabel = document.getElementById('ovScoreLabel');
  const ovBest       = document.getElementById('ovBest');
  const ovBtn        = document.getElementById('ovBtn');

  const grade = score >= 200 ? '🧠 GENIUS' : score >= 120 ? '🔥 GREAT' : score >= 60 ? '👍 GOOD' : '😅 KEEP TRYING';
  ovEmoji.textContent      = score >= 200 ? '🏆' : score >= 120 ? '🔥' : score >= 60 ? '🎯' : '😅';
  ovTitle.textContent      = grade;
  ovSub.textContent        = `You scored in 30 seconds`;
  ovScore.textContent      = score;
  ovScore.style.display    = 'block';
  ovScoreLabel.textContent = 'points';
  ovScoreLabel.style.display = 'block';
  ovBest.textContent       = `🏆 Best: ${bestScore} pts`;
  ovBest.style.display     = 'block';
  ovBtn.textContent        = '🔄 PLAY AGAIN';
  ovBtn.onclick            = startGame;

  overlay.classList.add('show');
}

// Keyboard: press first letter of color
document.addEventListener('keydown', e => {
  if (!running) return;
  const map = { r:'RED', b:'BLUE', g:'GREEN', y:'YELLOW', p:'PURPLE', o:'ORANGE' };
  const c = map[e.key.toLowerCase()];
  if (c) guess(c);
});

loadBest();
bestEl.textContent = bestScore;
</script>
</body>
</html>
