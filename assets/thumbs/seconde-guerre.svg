<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice">
  <title>La Seconde Guerre mondiale — les projecteurs fouillent le ciel d'une ville dans le noir</title>
          <defs>
            <linearGradient id="sguerreBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#05060a"/>
              <stop offset="66%"  stop-color="#101a2c"/>
              <stop offset="100%" stop-color="#1b2740"/>
            </linearGradient>
            <linearGradient id="sguerreBeam" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%"   stop-color="#cfe0ea" stop-opacity=".34"/>
              <stop offset="100%" stop-color="#cfe0ea" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="400" height="300" fill="url(#sguerreBg)"/>
          <!-- étoiles -->
          <g fill="#efe7d6">
            <circle cx="48"  cy="36" r="1.8" opacity=".55"/>
            <circle cx="150" cy="20" r="1.4" opacity=".45"/>
            <circle cx="288" cy="44" r="1.8" opacity=".5"/>
            <circle cx="358" cy="24" r="1.4" opacity=".45"/>
          </g>
          <!-- faisceaux de projecteurs -->
          <g transform="translate(72 262)">
            <path d="M-10,0 L-52,-262 L28,-262 L10,0Z" fill="url(#sguerreBeam)"/>
          </g>
          <g transform="translate(226 264)">
            <path d="M-9,0 L22,-264 L82,-264 L9,0Z" fill="url(#sguerreBeam)"/>
          </g>
          <g transform="translate(340 262)">
            <path d="M-10,0 L-64,-262 L4,-262 L10,0Z" fill="url(#sguerreBeam)"/>
          </g>
          <!-- avion pris dans un faisceau -->
          <g transform="translate(238 74)" fill="#0e1118">
            <path d="M0,0 L34,0 L44,4 L34,8 L0,8Z"/>
            <path d="M13,0 L3,-16 L11,-16 L24,0Z"/>
            <path d="M13,8 L3,24 L11,24 L24,8Z"/>
            <path d="M0,0 L-11,-8 L-6,0 L-11,8Z"/>
          </g>
          <!-- ville dans le noir -->
          <rect x="0" y="262" width="400" height="38" fill="#07080b"/>
          <g fill="#0a0c11">
            <rect x="8"   y="216" width="34" height="46"/>
            <rect x="48"  y="192" width="26" height="70"/>
            <rect x="82"  y="230" width="44" height="32"/>
            <rect x="136" y="204" width="30" height="58"/>
            <rect x="286" y="222" width="34" height="40"/>
            <rect x="326" y="198" width="26" height="64"/>
            <rect x="360" y="234" width="36" height="28"/>
          </g>
          <!-- coupole intacte au centre -->
          <g fill="#0b0e14">
            <path d="M188,232 Q212,182 236,232Z"/>
            <rect x="209" y="170" width="7" height="16"/>
            <rect x="184" y="232" width="56" height="30"/>
          </g>
          <!-- une seule fenêtre allumée -->
          <rect x="296" y="238" width="9" height="12" fill="#d9a63c" opacity=".75"/>
        </svg>
