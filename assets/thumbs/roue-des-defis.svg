      <stop offset="0%"   stop-color="#ffc93c" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffc93c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#rdBg)"/>
  <rect width="400" height="300" fill="url(#rdGlow)"/>

  <!-- la carte de question, à gauche -->
