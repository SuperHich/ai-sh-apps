<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a1856"/>
      <stop offset="60%"  stop-color="#140b2b"/>
      <stop offset="100%" stop-color="#0b0619"/>
