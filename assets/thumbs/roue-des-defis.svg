    <rect x="38" y="162" width="98" height="16" rx="8" fill="#3ddc97" fill-opacity=".3" stroke="#3ddc97" stroke-width="1.6"/>
    <rect x="38" y="184" width="98" height="16" rx="8" fill="#ffffff" fill-opacity=".07"/>
