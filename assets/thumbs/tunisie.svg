<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f0c1a"/>
      <stop offset="55%"  stop-color="#1b1426"/>
      <stop offset="100%" stop-color="#301a1a"/>
    </linearGradient>
    <radialGradient id="tnGlow" cx="70%" cy="34%" r="62%">
      <stop offset="0%"   stop-color="#f0c04b" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#f0c04b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tnLandThumb" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#f0c04b" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#ff8a5b" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e8534f" stop-opacity=".88"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#tnBg)"/>
  <rect width="400" height="300" fill="url(#tnGlow)"/>

  <!-- les strates du temps : une barre par grand âge, comme la bande de la page -->
  <g opacity=".62">
    <rect x="26" y="42" width="120" height="8" rx="4" fill="#c9973f"/>
    <rect x="26" y="58" width="150" height="8" rx="4" fill="#f0c04b"/>
    <rect x="26" y="74" width="96"  height="8" rx="4" fill="#d0603f"/>
    <rect x="26" y="90" width="132" height="8" rx="4" fill="#4fd8a6"/>
    <rect x="26" y="106" width="76" height="8" rx="4" fill="#5bb8ff"/>
  </g>

  <!-- ce que chaque époque a laissé debout : colonne punique, arcs romains, minaret -->
  <g fill="#0a0713" fill-opacity=".9">
    <!-- stèle punique -->
    <path d="M34,238 v-46 a11,11 0 0 1 22,0 v46 Z"/>
    <rect x="30" y="238" width="30" height="7" rx="2"/>
    <!-- arcades de l'amphithéâtre -->
    <path d="M74,238 v-32 h48 v32 h-9 v-20 a7,7 0 0 0 -14,0 v20 Z"/>
    <path d="M74,204 v-24 h48 v24 h-9 v-14 a7,7 0 0 0 -14,0 v14 Z"/>
    <!-- coupole et minaret carré -->
    <path d="M136,238 v-22 a17,17 0 0 1 34,0 v22 Z"/>
    <rect x="172" y="188" width="14" height="50" rx="2"/>
    <rect x="174" y="180" width="10" height="7" rx="2"/>
  </g>

  <!-- le pays lui-même -->
  <path d="M246.5 62.8 L258.4 58.6 L268.7 55.3 L274.9 52.0 L284.0 55.9 L285.9 65.2 L293.2 66.3 L303.1 59.2 L305.3 66.3 L296.9 76.5 L291.6 86.2 L292.3 92.8 L298.0 96.7 L303.3 102.7 L300.8 112.4 L297.3 123.7 L289.3 135.8 L280.8 142.7 L280.1 147.9 L292.7 154.5 L304.4 157.9 L313.8 166.7 L304.2 182.7 L295.0 197.8 L285.4 206.9 L275.6 225.4 L268.0 248.0 L258.4 213.0 L249.2 190.9 L241.2 183.2 L232.7 167.5 L222.2 146.8 L238.9 128.9 L240.0 111.0 L238.9 95.8 L243.5 76.5 Z"
        fill="url(#tnLandThumb)" stroke="#f4efe4" stroke-opacity=".45" stroke-width="2" stroke-linejoin="round"/>

  <!-- quatre capitales successives, du nord au sud -->
  <g stroke="#0f0c1a" stroke-width="2.2">
    <circle cx="286.3" cy="65.5"  r="6.5" fill="#f4efe4"/>
    <circle cx="281.3" cy="97.8"  r="5.5" fill="#0f0c1a" fill-opacity=".78"/>
    <circle cx="296.4" cy="123.7" r="4.5" fill="#0f0c1a" fill-opacity=".78"/>
    <circle cx="251.0" cy="132.5" r="4.5" fill="#0f0c1a" fill-opacity=".78"/>
  </g>

  <!-- la mer, deux traits -->
  <g stroke="#5bb8ff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M330,86 q10,-7 20,0 t20,0"/>
    <path d="M336,104 q10,-7 20,0 t20,0"/>
  </g>
</svg>
