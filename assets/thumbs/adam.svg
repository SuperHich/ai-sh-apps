<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="adamBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#050f1a"/>
              <stop offset="100%" stop-color="#0d2a16"/>
            </linearGradient>
            <radialGradient id="adamGlow" cx="50%" cy="45%" r="50%">
              <stop offset="0%"   stop-color="#a0f0c0" stop-opacity=".35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="adamEarth" cx="50%" cy="90%" r="50%">
              <stop offset="0%"   stop-color="#c8845a" stop-opacity=".4"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#adamBg)"/>
          <rect width="400" height="300" fill="url(#adamGlow)"/>
          <rect width="400" height="300" fill="url(#adamEarth)"/>
          <!-- stars -->
          <circle cx="40"  cy="25"  r="2"   fill="#f0c040" opacity=".8"/>
          <circle cx="90"  cy="40"  r="1.5" fill="white"   opacity=".6"/>
          <circle cx="150" cy="20"  r="2.5" fill="#f0c040" opacity=".9"/>
          <circle cx="260" cy="30"  r="2"   fill="white"   opacity=".7"/>
          <circle cx="340" cy="22"  r="1.5" fill="#f0c040" opacity=".8"/>
          <circle cx="370" cy="55"  r="1"   fill="white"   opacity=".5"/>
          <circle cx="200" cy="15"  r="1.5" fill="white"   opacity=".7"/>
          <!-- Paradise trees both sides -->
          <line x1="55"  y1="240" x2="50"  y2="150" stroke="#3a1a08" stroke-width="8"/>
          <ellipse cx="47" cy="138" rx="38" ry="46" fill="#1a6b30"/>
          <ellipse cx="62" cy="122" rx="28" ry="36" fill="#2a8040"/>
          <circle cx="44" cy="135" r="6"  fill="#f0c040"/>
          <circle cx="60" cy="126" r="5"  fill="#ff6644"/>
          <line x1="345" y1="240" x2="350" y2="150" stroke="#3a1a08" stroke-width="8"/>
          <ellipse cx="353" cy="138" rx="38" ry="46" fill="#1a6b30"/>
          <ellipse cx="338" cy="122" rx="28" ry="36" fill="#2a8040"/>
          <circle cx="356" cy="135" r="6"  fill="#f0c040"/>
          <circle cx="340" cy="126" r="5"  fill="#ff6644"/>
          <!-- Ground eden -->
          <rect x="0" y="240" width="400" height="60" fill="#1a5a28"/>
          <!-- Flowers -->
          <circle cx="110" cy="242" r="5" fill="#ff9999"/>
          <circle cx="135" cy="240" r="4" fill="#f0c040"/>
          <circle cx="270" cy="242" r="5" fill="#ff9999"/>
          <circle cx="295" cy="240" r="4" fill="#88ddff"/>
          <!-- Adam figure arms open -->
          <g transform="translate(200,185)">
            <circle cx="0" cy="-14" r="30" fill="#c9960c" opacity=".1"/>
            <path d="M-26,10 Q-20,72 0,76 Q20,72 26,10 Z" fill="#1e6b3a"/>
            <line x1="-26" y1="16" x2="-70" y2="4"  stroke="#1e6b3a" stroke-width="10" stroke-linecap="round"/>
            <line x1="26"  y1="16" x2="70"  y2="4"  stroke="#1e6b3a" stroke-width="10" stroke-linecap="round"/>
            <circle cx="-70" cy="3"  r="8" fill="#c9960c" opacity=".5"/>
            <circle cx="70"  cy="3"  r="8" fill="#c9960c" opacity=".5"/>
            <circle cx="0" cy="-14" r="18" fill="#c8845a"/>
            <circle cx="0" cy="-14" r="24" fill="none" stroke="#f0c040" stroke-width="1.5" opacity=".4"/>
            <path d="M-15,-28 Q0,-52 15,-28 L18,-10 Q0,-6 -18,-10 Z" fill="#0d2a16"/>
            <circle cx="-6" cy="-15" r="3" fill="#f0c040" opacity=".8"/>
            <circle cx="6"  cy="-15" r="3" fill="#f0c040" opacity=".8"/>
          </g>
          <!-- forbidden tree small center back -->
          <line x1="200" y1="240" x2="200" y2="165" stroke="#3a1a08" stroke-width="6" opacity=".5"/>
          <circle cx="200" cy="158" r="14" fill="#1a3a10" opacity=".6"/>
          <circle cx="200" cy="155" r="8"  fill="#c0392b" opacity=".7"/>
        </svg>
