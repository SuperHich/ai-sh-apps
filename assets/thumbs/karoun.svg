<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="karounBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#0e0a05"/>
              <stop offset="55%" stop-color="#1e1509"/>
              <stop offset="100%" stop-color="#a0622a"/>
            </linearGradient>
            <radialGradient id="karounGlow" cx="50%" cy="30%" r="50%">
              <stop offset="0%"   stop-color="#f5e6c8" stop-opacity=".3"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#karounBg)"/>
          <rect width="400" height="300" fill="url(#karounGlow)"/>
          <!-- stars -->
          <circle cx="60" cy="30" r="1.2" fill="#f5e6c8" opacity=".7"/>
          <circle cx="150" cy="18" r="1" fill="#f5e6c8" opacity=".5"/>
          <circle cx="300" cy="12" r="1.5" fill="#f5e6c8" opacity=".8"/>
          <circle cx="480" cy="22" r="1" fill="#f5e6c8" opacity=".6"/>
          <!-- desert ground -->
          <rect x="0" y="240" width="400" height="60" fill="#1e1208"/>
          <ellipse cx="200" cy="242" rx="200" ry="14" fill="#160e06"/>
          <!-- treasure chests -->
          <rect x="80" y="180" width="60" height="40" rx="4" fill="#5a3010"/>
          <rect x="80" y="180" width="60" height="10" rx="3" fill="#7a4518"/>
          <rect x="100" y="180" width="18" height="10" rx="2" fill="#c9a96e" opacity=".5"/>
          <circle cx="110" cy="183" r="4" fill="#e8a33d" opacity=".9"/>
          
          <rect x="260" y="170" width="80" height="50" rx="5" fill="#6b3814"/>
          <rect x="260" y="170" width="80" height="15" rx="5" fill="#8a4c1c"/>
          <rect x="290" y="170" width="20" height="15" rx="3" fill="#c9a96e" opacity=".4"/>
          <circle cx="300" cy="175" r="5" fill="#e8a33d" opacity=".9"/>
          <!-- gold coins spilling -->
          <ellipse cx="110" cy="220" rx="15" ry="6" fill="#e8a33d" opacity=".9"/>
          <ellipse cx="300" cy="220" rx="20" ry="8" fill="#e8a33d" opacity=".8"/>
          <!-- Kâroun figure with crown -->
          <g transform="translate(200,190)">
            <circle cx="0" cy="-15" r="12" fill="#c9a96e"/>
            <path d="M-12,-3 Q-12,15 0,18 Q12,15 12,-3 Q6,8 0,8 Q-6,8 -12,-3 Z" fill="#8b6020"/>
            <!-- crown -->
            <rect x="-8" y="-25" width="16" height="6" rx="1" fill="#e8a33d"/>
            <polygon points="-8,-25 -4,-32 0,-25" fill="#e8a33d"/>
            <polygon points="0,-25 4,-33 8,-25" fill="#e8a33d"/>
            <circle cx="0" cy="-30" r="2" fill="#c0392b" opacity=".9"/>
            <!-- arrogant pose -->
            <line x1="-12" y1="5" x2="12" y2="5" stroke="#c9a96e" stroke-width="6" stroke-linecap="round"/>
          </g>
          <!-- earth crack opening beneath -->
          <path d="M180,240 L190,260 L185,280" stroke="#c0392b" stroke-width="2" opacity=".7" stroke-linecap="round"/>
          <path d="M220,240 L210,265 L215,285" stroke="#c0392b" stroke-width="2" opacity=".6" stroke-linecap="round"/>
          <!-- red glow from depths -->
          <ellipse cx="200" cy="260" rx="40" ry="15" fill="#c0392b" opacity=".15"/>
        </svg>
