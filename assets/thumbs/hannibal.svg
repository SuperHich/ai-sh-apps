<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hanniBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#3a2418"/>
              <stop offset="55%" stop-color="#7a3f1f"/>
              <stop offset="100%" stop-color="#d9a441"/>
            </linearGradient>
            <radialGradient id="hanniGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#ffe6b0" stop-opacity=".3"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#hanniBg)"/>
          <rect width="400" height="300" fill="url(#hanniGlow)"/>
          <!-- sun -->
          <circle cx="200" cy="100" r="40" fill="#ffe9bd" opacity=".85"/>
          <!-- distant Carthage silhouette -->
          <g fill="#2a160d" opacity=".55">
            <rect x="40"  y="180" width="16" height="50"/>
            <rect x="65"  y="165" width="14" height="65"/>
            <rect x="90"  y="185" width="18" height="45"/>
            <rect x="280" y="175" width="14" height="55"/>
            <rect x="305" y="160" width="12" height="70"/>
            <rect x="325" y="180" width="18" height="50"/>
          </g>
          <!-- mountains / Alps -->
          <polygon points="0,230 100,140 200,200 300,120 400,170 400,300 0,300" fill="#5a3a1f" opacity=".7"/>
          <polygon points="60,230 160,160 260,200 360,150 400,185 400,300 0,300" fill="#7a4a20"/>
          <!-- ground -->
          <rect x="0" y="240" width="400" height="60" fill="#b5722f"/>
          <!-- elephant silhouette -->
          <g transform="translate(200,215)" fill="#2a160d">
            <ellipse cx="0" cy="0" rx="35" ry="22"/>
            <circle cx="-28" cy="-15" r="14"/>
            <path d="M-38,-8 Q-50,-2 -48,15" stroke="#2a160d" stroke-width="5" fill="none" stroke-linecap="round"/>
            <rect x="-18" y="18" width="8" height="18" rx="3"/>
            <rect x="-4"  y="18" width="8" height="18" rx="3"/>
            <rect x="10"  y="18" width="8" height="18" rx="3"/>
            <rect x="24"  y="18" width="8" height="18" rx="3"/>
            <path d="M-35,-20 Q-44,-28 -38,-18" fill="#2a160d"/>
            <path d="M-22,-24 Q-28,-32 -20,-24" fill="#2a160d"/>
            <!-- tusks -->
            <line x1="-38" y1="-5" x2="-46" y2="-14" stroke="#f3e6cf" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- Hannibal figure on elephant -->
          <g transform="translate(200,180)">
            <circle cx="0" cy="-10" r="10" fill="#c8845a"/>
            <path d="M-8,-18 Q0,-26 8,-18" fill="#c1440e"/>
            <path d="M-10,2 Q0,16 10,2 Z" fill="#c1440e"/>
          </g>
          <!-- sword -->
          <line x1="210" y1="174" x2="224" y2="160" stroke="#d9a441" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
