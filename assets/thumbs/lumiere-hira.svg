<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hiraBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0c0603"/>
              <stop offset="55%" stop-color="#170e08"/>
              <stop offset="100%" stop-color="#2c1810"/>
            </linearGradient>
            <radialGradient id="hiraGlow" cx="47%" cy="45%" r="45%">
              <stop offset="0%" stop-color="#f4d78a" stop-opacity=".45"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <linearGradient id="hiraRay" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#f0e3c4" stop-opacity=".5"/>
              <stop offset="100%" stop-color="#f0e3c4" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="400" height="300" fill="url(#hiraBg)"/>
          <rect width="400" height="300" fill="url(#hiraGlow)"/>
          <!-- stars -->
          <circle cx="40" cy="26" r="2" fill="#f0e3c4" opacity=".8"/>
          <circle cx="98" cy="48" r="1.5" fill="#f0e3c4" opacity=".6"/>
          <circle cx="150" cy="20" r="1.8" fill="#d9a94e" opacity=".8"/>
          <circle cx="252" cy="34" r="1.5" fill="#f0e3c4" opacity=".7"/>
          <circle cx="312" cy="16" r="2" fill="#f0e3c4" opacity=".6"/>
          <circle cx="374" cy="60" r="1.5" fill="#d9a94e" opacity=".8"/>
          <!-- crescent moon -->
          <circle cx="336" cy="58" r="21" fill="#f0e3c4" opacity=".9"/>
          <circle cx="345" cy="50" r="17" fill="#0c0603"/>
          <!-- mount Hira -->
          <polygon points="110,265 200,80 296,265" fill="#241408"/>
          <polygon points="150,265 200,80 240,180" fill="#2e1a0c" opacity=".6"/>
          <!-- cave mouth -->
          <polygon points="178,158 200,126 213,158" fill="#0c0603"/>
          <!-- light pouring out of the cave -->
          <g transform="translate(196,143)">
            <circle r="20" fill="#f4d78a" opacity=".35"/>
            <circle r="7" fill="#fff3d6"/>
            <polygon points="0,-44 3,-15 -3,-15" fill="url(#hiraRay)"/>
            <polygon points="44,0 15,3 15,-3" fill="url(#hiraRay)"/>
            <polygon points="0,44 -3,15 3,15" fill="url(#hiraRay)"/>
            <polygon points="-44,0 -15,-3 -15,3" fill="url(#hiraRay)"/>
            <polygon points="31,-31 11,-9 5,-15" fill="url(#hiraRay)" opacity=".7"/>
            <polygon points="31,31 9,11 15,5" fill="url(#hiraRay)" opacity=".7"/>
            <polygon points="-31,31 -11,9 -5,15" fill="url(#hiraRay)" opacity=".7"/>
            <polygon points="-31,-31 -9,-11 -15,-5" fill="url(#hiraRay)" opacity=".7"/>
          </g>
          <!-- dunes -->
          <polygon points="0,248 80,232 170,248 260,234 340,246 400,238 400,300 0,300" fill="#1c1108"/>
          <polygon points="0,268 100,252 210,266 310,250 400,262 400,300 0,300" fill="#130c06"/>
          <!-- the Kaaba at the foot of the mountain -->
          <g transform="translate(58,224)">
            <rect x="-20" y="-30" width="40" height="34" fill="#141414"/>
            <polygon points="-20,-30 0,-40 20,-30" fill="#1c1c1c"/>
            <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#d9a94e" stroke-width="2.5"/>
          </g>
          <!-- caravan crossing the foreground -->
          <g fill="#0c0603" transform="translate(250,258)">
            <g>
              <ellipse cx="16" cy="12" rx="11" ry="6"/>
              <path d="M10 7 Q16 -4 21 7 Z"/>
              <path d="M25 10 Q31 0 35 3 Q36 4 35 5 Q32 4 29 11 Z"/>
              <g stroke="#0c0603" stroke-width="2" stroke-linecap="round">
                <line x1="8" y1="18" x2="8" y2="11"/>
                <line x1="13" y1="18" x2="13" y2="12"/>
                <line x1="19" y1="18" x2="19" y2="12"/>
                <line x1="24" y1="18" x2="24" y2="11"/>
              </g>
            </g>
            <g transform="translate(44,3) scale(.8)">
              <ellipse cx="16" cy="12" rx="11" ry="6"/>
              <path d="M10 7 Q16 -4 21 7 Z"/>
              <path d="M25 10 Q31 0 35 3 Q36 4 35 5 Q32 4 29 11 Z"/>
              <g stroke="#0c0603" stroke-width="2.4" stroke-linecap="round">
                <line x1="8" y1="18" x2="8" y2="11"/>
                <line x1="13" y1="18" x2="13" y2="12"/>
                <line x1="19" y1="18" x2="19" y2="12"/>
                <line x1="24" y1="18" x2="24" y2="11"/>
              </g>
            </g>
          </g>
          <!-- eight-point star signet -->
          <g transform="translate(48,58)" fill="none" stroke="#d9a94e" stroke-width="2" opacity=".55">
            <rect x="-14" y="-14" width="28" height="28"/>
            <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)"/>
          </g>
        </svg>
