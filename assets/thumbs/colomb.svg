<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="colombBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#0a1420"/>
              <stop offset="55%" stop-color="#1a3a5e"/>
              <stop offset="100%" stop-color="#2e5a7a"/>
            </linearGradient>
            <radialGradient id="colombGlow" cx="50%" cy="30%" r="50%">
              <stop offset="0%"   stop-color="#d4a832" stop-opacity=".2"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#colombBg)"/>
          <rect width="400" height="300" fill="url(#colombGlow)"/>
          <!-- stars -->
          <circle cx="40"  cy="25"  r="1.2" fill="#f0e4cc" opacity=".7"/>
          <circle cx="100" cy="15"  r="1"   fill="#f0c040" opacity=".8"/>
          <circle cx="300" cy="20"  r="1.4" fill="#f0e4cc" opacity=".7"/>
          <circle cx="360" cy="35"  r="1"   fill="#f0c040" opacity=".6"/>
          <!-- horizon sea -->
          <path d="M0,200 Q200,185 400,200 L400,300 L0,300 Z" fill="#0d1f3c"/>
          <path d="M0,215 Q100,205 200,215 Q300,225 400,215 L400,300 L0,300 Z" fill="#081828"/>
          <!-- ship silhouette -->
          <g transform="translate(180,185)">
            <path d="M-40,5 Q0,18 40,5 Q38,22 -38,22 Q-42,18 -40,5Z" fill="#1a1a14"/>
            <rect x="-10" y="-35" width="4" height="40" rx="1" fill="#1a1a14"/>
            <rect x="10"  y="-25" width="3" height="30" rx="1" fill="#1a1a14"/>
            <path d="M-8,-30 Q8,-35 20,-28 L18,-25 Q6,-32 -8,-28Z" fill="#e8ddb0" opacity=".7"/>
            <path d="M-6,-18 Q8,-22 18,-16 L16,-13 Q6,-19 -6,-15Z" fill="#e8ddb0" opacity=".6"/>
            <line x1="40" y1="5" x2="55" y2="-10" stroke="#d4a832" stroke-width="2" stroke-linecap="round"/>
            <polygon points="55,-10 50,-12 50,-8" fill="#d4a832"/>
          </g>
          <!-- compass rose -->
          <g transform="translate(320,80)" opacity=".8">
            <circle cx="0" cy="0" r="28" fill="none" stroke="#d4a832" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="22" fill="none" stroke="#d4a832" stroke-width="0.5" opacity=".5"/>
            <line x1="0" y1="-28" x2="0" y2="28" stroke="#d4a832" stroke-width="1"/>
            <line x1="-28" y1="0" x2="28" y2="0" stroke="#d4a832" stroke-width="1"/>
            <polygon points="0,-28 6,-6 0,6 -6,-6" fill="#d4a832"/>
            <polygon points="0,28 -6,6 0,-6 6,6" fill="#b03a1e"/>
          </g>
        </svg>
