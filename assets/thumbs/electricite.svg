<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice">
  <title>Un éclair relié par un fil à une ampoule allumée</title>
          <defs>
            <linearGradient id="elecBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#04050a"/>
              <stop offset="55%"  stop-color="#101d33"/>
              <stop offset="100%" stop-color="#2a6ea8"/>
            </linearGradient>
            <radialGradient id="elecGlow" cx="62%" cy="52%" r="52%">
              <stop offset="0%"   stop-color="#e0a63c" stop-opacity=".34"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#elecBg)"/>
          <rect width="400" height="300" fill="url(#elecGlow)"/>
          <!-- nuage d'orage -->
          <g fill="#141a26" opacity=".95">
            <ellipse cx="104" cy="56" rx="80" ry="30"/>
            <ellipse cx="56"  cy="66" rx="50" ry="22"/>
            <ellipse cx="158" cy="68" rx="56" ry="24"/>
          </g>
          <!-- éclair -->
          <path d="M104,84 L78,140 L110,140 L70,214" fill="none" stroke="#8fd4ff"
                stroke-width="7" stroke-linejoin="round"/>
          <path d="M104,84 L78,140 L110,140 L70,214" fill="none" stroke="#eaf7ff"
                stroke-width="2.6" stroke-linejoin="round"/>
          <!-- fil qui relie -->
          <path d="M112,232 Q184,262 250,222" fill="none" stroke="#c0743a" stroke-width="5"/>
          <!-- ampoule -->
          <g transform="translate(292 168)">
            <ellipse rx="76" ry="76" fill="#e0a63c" opacity=".18"/>
            <path d="M-38,16 Q-50,-34 -20,-58 Q0,-72 20,-58 Q50,-34 38,16 Q26,38 0,38 Q-26,38 -38,16Z"
                  fill="#0d1016" stroke="#8fd4ff" stroke-width="2.4"/>
            <rect x="-20" y="38" width="40" height="12" rx="3" fill="#3a3a44"/>
            <rect x="-17" y="50" width="34" height="10" rx="3" fill="#2e2e38"/>
            <rect x="-14" y="60" width="28" height="9"  rx="3" fill="#3a3a44"/>
            <path d="M-14,28 L-14,-10 q6,-12 12,0 t12,0 t12,0 L26,28"
                  fill="none" stroke="#ffd88a" stroke-width="3"/>
          </g>
          <!-- étincelles -->
          <g fill="#8fd4ff">
            <circle cx="196" cy="102" r="2.4"/><circle cx="360" cy="70" r="2"/>
            <circle cx="44"  cy="252" r="2.2"/>
          </g>
        </svg>
