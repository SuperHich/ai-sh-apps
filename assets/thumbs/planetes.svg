<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04040c"/>
      <stop offset="60%"  stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#1b2a63"/>
    </linearGradient>
    <radialGradient id="plSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff3c0"/>
      <stop offset="55%"  stop-color="#ff9d3c"/>
      <stop offset="100%" stop-color="#c25a10"/>
    </radialGradient>
    <radialGradient id="plSunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff9d3c" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ff9d3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plRing" cx="32%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#fff3d4"/>
      <stop offset="52%"  stop-color="#e3c893"/>
      <stop offset="100%" stop-color="#6b4f22"/>
    </radialGradient>
    <radialGradient id="plBlue" cx="34%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#a8e0ff"/>
      <stop offset="46%"  stop-color="#3d7ad6"/>
      <stop offset="100%" stop-color="#08172f"/>
    </radialGradient>
    <radialGradient id="plRed" cx="34%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#ffb896"/>
      <stop offset="48%"  stop-color="#c1502e"/>
      <stop offset="100%" stop-color="#2a0f08"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#plBg)"/>

  <!-- étoiles -->
  <g fill="#f4efe4">
    <circle cx="28"  cy="34"  r="1.4" opacity=".9"/>
    <circle cx="96"  cy="20"  r="1"   opacity=".6"/>
    <circle cx="168" cy="44"  r="1.2" opacity=".75"/>
    <circle cx="242" cy="26"  r="1"   opacity=".55"/>
    <circle cx="318" cy="52"  r="1.5" opacity=".85"/>
    <circle cx="372" cy="28"  r="1.1" opacity=".6"/>
    <circle cx="58"  cy="96"  r="1"   opacity=".5"/>
    <circle cx="146" cy="118" r="1.2" opacity=".45"/>
    <circle cx="352" cy="140" r="1.3" opacity=".6"/>
    <circle cx="36"  cy="212" r="1.1" opacity=".5"/>
    <circle cx="122" cy="268" r="1.4" opacity=".7"/>
    <circle cx="288" cy="248" r="1"   opacity=".45"/>
    <circle cx="386" cy="214" r="1.2" opacity=".55"/>
  </g>

  <!-- le Soleil, en bord de cadre -->
  <circle cx="16" cy="150" r="86" fill="url(#plSunHalo)"/>
  <circle cx="16" cy="150" r="44" fill="url(#plSun)"/>

  <!-- la planète aux anneaux, sujet principal -->
  <g transform="translate(238,150)">
    <ellipse rx="112" ry="30" fill="none" stroke="#e3c893" stroke-width="9"
             opacity=".5" transform="rotate(-17)"/>
    <circle r="62" fill="url(#plRing)"/>
    <path d="M-62,0 A62,62 0 0 0 62,0 Z" fill="#000" opacity=".28"/>
    <ellipse cx="0" cy="-16" rx="52" ry="8" fill="#fff3d4" opacity=".22"/>
    <ellipse cx="0" cy="10"  rx="56" ry="7" fill="#8a6a2c" opacity=".26"/>
    <ellipse cx="0" cy="28"  rx="44" ry="6" fill="#8a6a2c" opacity=".2"/>
    <path d="M-112,0 A112,30 0 0 0 112,0" fill="none" stroke="#fff3d4" stroke-width="9"
          opacity=".85" transform="rotate(-17)"/>
    <path d="M-112,0 A112,30 0 0 0 112,0" fill="none" stroke="#0b1230" stroke-width="2"
          opacity=".55" transform="rotate(-17)"/>
  </g>

  <!-- deux mondes en visite -->
  <g transform="translate(96,232)">
    <circle r="26" fill="url(#plBlue)"/>
    <path d="M-13,-8 q9,-6 17,1 q-4,7 -12,6 Z" fill="#4fd8a6" opacity=".7"/>
    <path d="M2,10 q10,-3 14,5 q-8,4 -14,-2 Z" fill="#4fd8a6" opacity=".55"/>
  </g>
  <g transform="translate(342,74)">
    <circle r="17" fill="url(#plRed)"/>
    <circle cx="-5" cy="-7" r="4" fill="#7d3f22" opacity=".55"/>
    <ellipse cx="0" cy="-13" rx="8" ry="3" fill="#f2f6fa" opacity=".7"/>
  </g>
</svg>
