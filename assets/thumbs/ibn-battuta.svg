<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ibnBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#160c10"/>
              <stop offset="55%" stop-color="#6a3418"/>
              <stop offset="100%" stop-color="#c4622d"/>
            </linearGradient>
            <radialGradient id="ibnGlow" cx="50%" cy="35%" r="50%">
              <stop offset="0%"   stop-color="#f0e2c0" stop-opacity=".28"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#ibnBg)"/>
          <rect width="400" height="300" fill="url(#ibnGlow)"/>
          <!-- stars -->
          <circle cx="60"  cy="28" r="1.3" fill="#f0e2c0" opacity=".7"/>
          <circle cx="140" cy="16" r="1"   fill="#d4a030" opacity=".8"/>
          <circle cx="310" cy="22" r="1.4" fill="#f0e2c0" opacity=".7"/>
          <circle cx="360" cy="40" r="1"   fill="#d4a030" opacity=".6"/>
          <!-- crescent moon -->
          <circle cx="320" cy="70" r="26" fill="#f0e2c0" opacity=".9"/>
          <circle cx="330" cy="62" r="22" fill="#6a3418"/>
          <!-- dunes -->
          <path d="M0,220 Q120,190 240,215 Q320,232 400,210 L400,300 L0,300 Z" fill="#8a4a24"/>
          <path d="M0,245 Q140,220 280,245 Q340,255 400,242 L400,300 L0,300 Z" fill="#c4622d"/>
          <!-- camel with rider silhouette -->
          <g transform="translate(190,205)" fill="#2a160d">
            <ellipse cx="0" cy="0" rx="34" ry="14"/>
            <path d="M-14,-4 Q-10,-18 -2,-6 Q4,-18 10,-4 Z"/>
            <path d="M28,-4 Q42,-20 46,-40 Q47,-45 42,-42 Q34,-26 24,-8 Z"/>
            <circle cx="44" cy="-42" r="6"/>
            <rect x="-24" y="10" width="6" height="20" rx="2"/>
            <rect x="-10" y="10" width="6" height="20" rx="2"/>
            <rect x="8"   y="10" width="6" height="20" rx="2"/>
            <rect x="22"  y="10" width="6" height="20" rx="2"/>
            <path d="M-38,4 Q-46,10 -42,20" stroke="#2a160d" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- rider -->
            <ellipse cx="2" cy="-20" rx="6" ry="7"/>
            <path d="M-4,-14 Q2,-4 8,-14 Z"/>
          </g>
          <!-- palm tree -->
          <g transform="translate(70,215)" fill="#2a160d" opacity=".7">
            <rect x="-2" y="-30" width="5" height="34" rx="2"/>
            <path d="M0,-30 Q-18,-38 -28,-32 M0,-30 Q-14,-46 -22,-48 M0,-30 Q14,-46 22,-48 M0,-30 Q18,-38 28,-32" stroke="#2a160d" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
