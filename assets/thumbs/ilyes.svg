<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ilyesBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#060810"/>
              <stop offset="50%" stop-color="#1a1008"/>
              <stop offset="100%" stop-color="#3a1a08"/>
            </linearGradient>
            <radialGradient id="ilyesGlow" cx="50%" cy="55%" r="50%">
              <stop offset="0%" stop-color="#e06820" stop-opacity=".35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#ilyesBg)"/>
          <rect width="400" height="300" fill="url(#ilyesGlow)"/>
          <!-- stars -->
          <circle cx="35" cy="22" r="2" fill="#f0c040" opacity=".9"/>
          <circle cx="90" cy="35" r="1.5" fill="white" opacity=".7"/>
          <circle cx="160" cy="18" r="2" fill="white" opacity=".8"/>
          <circle cx="255" cy="30" r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="330" cy="15" r="2" fill="white" opacity=".6"/>
          <circle cx="375" cy="40" r="1.5" fill="#f0c040" opacity=".8"/>
          <!-- storm clouds -->
          <ellipse cx="100" cy="40" rx="85" ry="35" fill="#1a2a4a" opacity=".7"/>
          <ellipse cx="300" cy="45" rx="90" ry="38" fill="#1a2a4a" opacity=".7"/>
          <!-- lightning bolt -->
          <path d="M200,30 L190,70 L205,68 L185,120" stroke="#f0c040" stroke-width="3.5" fill="none" opacity=".85"/>
          <!-- Desert mountains -->
          <polygon points="0,240 70,195 150,220 240,185 330,210 400,190 400,300 0,300" fill="#c8a04a" opacity=".7"/>
          <polygon points="0,260 90,238 190,252 280,230 370,248 400,242 400,300 0,300" fill="#d4b060"/>
          <!-- Fire altar (center) -->
          <g transform="translate(200,220)">
            <rect x="-30" y="0" width="60" height="20" fill="#8b5e3c" rx="3"/>
            <rect x="-25" y="-8" width="50" height="10" fill="#6b4020"/>
            <!-- flames -->
            <path d="M-20,-8 Q-14,-40 -5,-8 Q0,-55 8,-8 Q14,-42 22,-8" fill="#e06820" opacity=".9"/>
            <path d="M-14,-8 Q-8,-35 0,-8 Q6,-45 14,-8" fill="#f0c040" opacity=".7"/>
            <path d="M-8,-8 Q-2,-28 4,-8 Q8,-35 12,-8" fill="#ffe8a0" opacity=".5"/>
          </g>
          <!-- Ilyès figure -->
          <g transform="translate(120,195)">
            <circle cx="0" cy="-14" r="30" fill="#f0c040" opacity=".08"/>
            <path d="M-20,10 Q-16,65 0,68 Q16,65 20,10 Z" fill="#1a6b4a"/>
            <line x1="-20" y1="14" x2="-48" y2="-12" stroke="#1a6b4a" stroke-width="8" stroke-linecap="round"/>
            <line x1="20" y1="14" x2="48" y2="-12" stroke="#1a6b4a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="-50" cy="-14" r="6" fill="#c8906a" opacity=".6"/>
            <circle cx="50" cy="-14" r="6" fill="#c8906a" opacity=".6"/>
            <circle cx="0" cy="-14" r="16" fill="#c8906a"/>
            <path d="M-12,-26 Q0,-44 12,-26 L14,-8 Q0,-5 -14,-8 Z" fill="#3a1a08"/>
            <ellipse cx="0" cy="-3" rx="4" ry="3" fill="#5c3010" opacity=".8"/>
            <circle cx="-5" cy="-16" r="2.5" fill="#1a1a1a"/>
            <circle cx="5" cy="-16" r="2.5" fill="#1a1a1a"/>
            <circle cx="0" cy="-14" r="22" fill="none" stroke="#f0c040" stroke-width="1.5" opacity=".3"/>
          </g>
          <!-- Broken idol (right) -->
          <g transform="translate(320,240)" opacity=".5">
            <rect x="-12" y="-30" width="24" height="30" fill="#5a5a5a" rx="2"/>
            <circle cx="0" cy="-35" r="10" fill="#5a5a5a"/>
            <path d="M-8,-28 L-14,-18" stroke="#3a3a3a" stroke-width="2"/>
            <path d="M10,-30 L18,-35" stroke="#3a3a3a" stroke-width="2"/>
          </g>
          <!-- Rain drops starting -->
          <g stroke="#88aaff" stroke-width="1.5" opacity=".25">
            <line x1="50" y1="60" x2="42" y2="100"/>
            <line x1="140" y1="50" x2="132" y2="90"/>
            <line x1="350" y1="55" x2="342" y2="95"/>
          </g>
        </svg>
