<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="phareBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#050d16"/>
              <stop offset="55%" stop-color="#0a1826"/>
              <stop offset="100%" stop-color="#16324a"/>
            </linearGradient>
            <radialGradient id="phareGlow" cx="37%" cy="30%" r="45%">
              <stop offset="0%"   stop-color="#f1b24a" stop-opacity=".30"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <linearGradient id="phareBeam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#f1b24a" stop-opacity=".5"/>
              <stop offset="100%" stop-color="#f1b24a" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="400" height="300" fill="url(#phareBg)"/>
          <rect width="400" height="300" fill="url(#phareGlow)"/>
          <!-- lune et étoiles -->
          <circle cx="318" cy="56" r="20" fill="#eef1ec" opacity=".9"/>
          <circle cx="312" cy="49" r="4"  fill="#c9d3ce" opacity=".45"/>
          <circle cx="60"  cy="40" r="1.6" fill="#eef1ec" opacity=".8"/>
