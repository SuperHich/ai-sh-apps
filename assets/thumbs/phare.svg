          <polygon points="132,104 168,104 180,232 120,232" fill="#1a3550"/>
          <polygon points="132,104 168,104 164,132 136,132" fill="#e7ede8"/>
          <polygon points="136,132 164,132 160,160 140,160" fill="#e7ede8" opacity=".85"/>
          <polygon points="140,160 160,160 157,188 143,188" fill="#e7ede8" opacity=".7"/>
          <rect x="142" y="188" width="16" height="44" fill="#0d2033"/>
