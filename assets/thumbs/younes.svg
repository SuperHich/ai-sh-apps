<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="younesBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#020d1a"/>
              <stop offset="60%" stop-color="#063a5c"/>
              <stop offset="100%" stop-color="#0a6b8a"/>
            </linearGradient>
            <radialGradient id="younesGlow" cx="50%" cy="60%" r="55%">
              <stop offset="0%"   stop-color="#0abfbc" stop-opacity=".35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="moonCard" cx="75%" cy="20%" r="30%">
              <stop offset="0%"   stop-color="#fffbe6" stop-opacity=".4"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#younesBg)"/>
          <rect width="400" height="300" fill="url(#younesGlow)"/>
          <rect width="400" height="300" fill="url(#moonCard)"/>
          <!-- stars -->
          <circle cx="30"  cy="22"  r="2"   fill="#f0c040" opacity=".9"/>
          <circle cx="75"  cy="38"  r="1.5" fill="white"   opacity=".7"/>
          <circle cx="130" cy="16"  r="2"   fill="white"   opacity=".8"/>
          <circle cx="210" cy="30"  r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="310" cy="18"  r="2"   fill="white"   opacity=".6"/>
          <circle cx="370" cy="40"  r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="170" cy="10"  r="1"   fill="white"   opacity=".5"/>
          <!-- Moon -->
          <circle cx="340" cy="52" r="28"  fill="#ffe8a0" opacity=".8"/>
          <circle cx="352" cy="42" r="23"  fill="#020d1a"/>
          <!-- Ocean surface -->
          <rect x="0" y="175" width="400" height="125" fill="#063a5c" opacity=".8"/>
          <path d="M0,175 Q100,158 200,175 Q300,192 400,175" fill="none" stroke="#c8f0ff" stroke-width="2.5" opacity=".4"/>
          <path d="M0,188 Q100,172 200,188 Q300,204 400,188" fill="none" stroke="#c8f0ff" stroke-width="1.5" opacity=".25"/>
          <!-- THE WHALE — large and majestic -->
          <g transform="translate(200,210)">
            <ellipse cx="0"   cy="0" rx="160" ry="52" fill="#0a3a5c"/>
            <ellipse cx="-120" cy="0" rx="55"  ry="44" fill="#0a4a6c"/>
            <ellipse cx="30"  cy="20" rx="110" ry="24" fill="#0d5a7a" opacity=".4"/>
            <path d="M158,-16 Q195,-48 192,0 Q188,48 158,16 Z" fill="#063a5c"/>
            <!-- pec fin -->
            <path d="M20,-50 Q-8,-92 32,-82 Q56,-72 44,-50 Z" fill="#084a6a"/>
            <path d="M20,38 Q-8,78 30,66 Q52,56 40,38 Z" fill="#084a6a"/>
            <!-- eye -->
            <circle cx="-106" cy="-10" r="12"  fill="white"/>
            <circle cx="-106" cy="-10" r="7"   fill="#020d1a"/>
            <circle cx="-103" cy="-13" r="3"   fill="white"/>
            <!-- mouth -->
            <path d="M-170,10 Q-148,28 -120,18" stroke="#c8f0ff" stroke-width="3" fill="none" opacity=".4"/>
            <!-- blowhole spray -->
            <line x1="-50" y1="-52" x2="-52" y2="-82" stroke="#c8f0ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
            <line x1="-50" y1="-52" x2="-65" y2="-78" stroke="#c8f0ff" stroke-width="2"   stroke-linecap="round" opacity=".5"/>
            <line x1="-50" y1="-52" x2="-36" y2="-76" stroke="#c8f0ff" stroke-width="2"   stroke-linecap="round" opacity=".5"/>
            <!-- inside glow -->
            <ellipse cx="10" cy="5" rx="55" ry="30" fill="#021820" opacity=".9"/>
            <ellipse cx="10" cy="5" rx="55" ry="30" fill="#f0c040" opacity=".08"/>
            <!-- Younes praying tiny inside -->
            <g transform="translate(8,8)">
              <circle cx="0" cy="-10" r="7"  fill="#c8906a"/>
              <path d="M-7,0 Q0,16 7,0 Z" fill="#1e6b3a"/>
              <line x1="-7" y1="2"  x2="-18" y2="-12" stroke="#1e6b3a" stroke-width="4" stroke-linecap="round"/>
              <line x1="7"  y1="2"  x2="18"  y2="-12" stroke="#1e6b3a" stroke-width="4" stroke-linecap="round"/>
              <circle cx="-20" cy="-14" r="4" fill="#f0c040" opacity=".6"/>
              <circle cx="20"  cy="-14" r="4" fill="#f0c040" opacity=".6"/>
            </g>
          </g>
          <!-- bioluminescent dots -->
          <circle cx="50"  cy="200" r="2"   fill="#0abfbc" opacity=".5"/>
          <circle cx="350" cy="220" r="1.5" fill="#0abfbc" opacity=".4"/>
          <circle cx="100" cy="240" r="1.5" fill="#0abfbc" opacity=".4"/>
          <circle cx="300" cy="195" r="2"   fill="#0abfbc" opacity=".5"/>
          <!-- fish -->
          <ellipse cx="55"  cy="245" rx="10" ry="6" fill="#0abfbc" opacity=".5"/>
          <path d="M45,245 Q40,240 42,245 Q40,250 45,245 Z" fill="#0abfbc" opacity=".5"/>
          <ellipse cx="340" cy="255" rx="9"  ry="5" fill="#5ab8e0" opacity=".4"/>
        </svg>
