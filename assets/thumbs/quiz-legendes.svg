<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241410"/>
      <stop offset="1" stop-color="#0b0708"/>
    </linearGradient>
    <linearGradient id="juste" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="1" stop-color="#f0c04b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#ciel)"/>

  <!-- poussière d'étoiles -->
  <g fill="#f4efe4" opacity=".5">
    <circle cx="42" cy="46" r="1.8"/><circle cx="96" cy="28" r="1.2"/>
    <circle cx="330" cy="52" r="1.6"/><circle cx="368" cy="104" r="1.1"/>
    <circle cx="28" cy="150" r="1.3"/><circle cx="356" cy="236" r="1.5"/>
    <circle cx="66" cy="252" r="1.1"/><circle cx="286" cy="24" r="1.3"/>
  </g>

  <!-- trois propositions, la bonne cochée -->
  <g>
    <rect x="86" y="66" width="228" height="46" rx="14" fill="#f4efe4" opacity=".09"/>
    <rect x="86" y="66" width="228" height="46" rx="14" fill="none" stroke="#f4efe4" stroke-opacity=".22"/>
    <rect x="106" y="82" width="120" height="8" rx="4" fill="#f4efe4" opacity=".3"/>

    <rect x="76" y="126" width="248" height="52" rx="15" fill="url(#juste)" opacity=".22"/>
    <rect x="76" y="126" width="248" height="52" rx="15" fill="none" stroke="#ff8a5b" stroke-width="2"/>
    <rect x="98" y="146" width="140" height="9" rx="4.5" fill="#ff8a5b" opacity=".85"/>
    <path d="M262 152 l10 11 20 -23" fill="none" stroke="#ff8a5b" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="86" y="192" width="228" height="46" rx="14" fill="#f4efe4" opacity=".09"/>
    <rect x="86" y="192" width="228" height="46" rx="14" fill="none" stroke="#f4efe4" stroke-opacity=".22"/>
    <rect x="106" y="208" width="96" height="8" rx="4" fill="#f4efe4" opacity=".3"/>
  </g>

  <!-- point d'interrogation, tracé à la main -->
  <g transform="translate(46 250) scale(1.05)" fill="none" stroke="#ff8a5b" stroke-width="7"
     stroke-linecap="round" opacity=".9">
    <path d="M-14 -34 a15 15 0 1 1 14 22 v7"/>
    <path d="M0 8 v1"/>
  </g>
</svg>
