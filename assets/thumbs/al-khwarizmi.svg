<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="khwBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#06040c"/>
              <stop offset="55%" stop-color="#1a2a5a"/>
              <stop offset="100%" stop-color="#2a8a7a"/>
            </linearGradient>
            <radialGradient id="khwGlow" cx="50%" cy="38%" r="55%">
              <stop offset="0%"   stop-color="#d4a020" stop-opacity=".25"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#khwBg)"/>
          <rect width="400" height="300" fill="url(#khwGlow)"/>
          <!-- stars -->
          <circle cx="40"  cy="28" r="1.3" fill="#f0e4c0" opacity=".8"/>
          <circle cx="120" cy="18" r="1"   fill="#d4a020" opacity=".8"/>
          <circle cx="300" cy="22" r="1.4" fill="#f0e4c0" opacity=".7"/>
          <circle cx="350" cy="44" r="1"   fill="#2a8a7a" opacity=".7"/>
          <!-- crescent moon -->
          <circle cx="330" cy="66" r="22" fill="#f0e4c0" opacity=".85"/>
          <circle cx="340" cy="60" r="18" fill="#1a2a5a"/>
          <!-- islamic 8-point star geometry -->
          <g stroke="#d4a020" stroke-width="1" fill="none" opacity=".5">
            <rect x="160" y="70" width="80" height="80" transform="rotate(45 200 110)"/>
            <rect x="160" y="70" width="80" height="80"/>
            <circle cx="200" cy="110" r="56"/>
          </g>
          <!-- algebra equation -->
          <text font-family="'EB Garamond',Georgia,serif" font-size="22" font-style="italic" fill="#f0e4c0" text-anchor="middle" x="200" y="118" opacity=".9">x² + 10x = 39</text>
          <!-- house of wisdom dome silhouette -->
          <path d="M150,240 Q150,200 200,188 Q250,200 250,240 Z" fill="#0e0c1a"/>
          <rect x="150" y="238" width="100" height="40" fill="#0e0c1a"/>
          <circle cx="200" cy="184" r="5" fill="#d4a020" opacity=".7"/>
          <!-- arches -->
          <path d="M162,278 Q162,252 178,248 Q194,252 194,278 Z" fill="#06040c"/>
          <path d="M206,278 Q206,252 222,248 Q238,252 238,278 Z" fill="#06040c"/>
          <!-- minarets -->
          <rect x="120" y="210" width="14" height="68" rx="3" fill="#0c0a16"/>
          <ellipse cx="127" cy="208" rx="9" ry="4" fill="#12102a"/>
          <rect x="266" y="210" width="14" height="68" rx="3" fill="#0c0a16"/>
          <ellipse cx="273" cy="208" rx="9" ry="4" fill="#12102a"/>
        </svg>
