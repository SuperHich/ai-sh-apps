<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="mohamedBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#050f1a"/>
              <stop offset="60%" stop-color="#0d2a1f"/>
              <stop offset="100%" stop-color="#1a3a2a"/>
            </linearGradient>
            <radialGradient id="mohamedGlow" cx="65%" cy="30%" r="45%">
              <stop offset="0%"   stop-color="#fffbe6" stop-opacity=".35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#mohamedBg)"/>
          <rect width="400" height="300" fill="url(#mohamedGlow)"/>
          <!-- Stars -->
          <circle cx="30"  cy="20"  r="2"   fill="#f0c040" opacity=".9"/>
          <circle cx="80"  cy="35"  r="1.5" fill="white"   opacity=".7"/>
          <circle cx="140" cy="15"  r="2.5" fill="white"   opacity=".8"/>
          <circle cx="220" cy="28"  r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="300" cy="18"  r="1"   fill="white"   opacity=".6"/>
          <circle cx="360" cy="42"  r="2"   fill="white"   opacity=".8"/>
          <!-- Crescent moon -->
          <circle cx="340" cy="58" r="30"  fill="#ffe8a0" opacity=".8"/>
          <circle cx="352" cy="48" r="25"  fill="#050f1a"/>
          <!-- Star of Islam -->
          <polygon points="385,28 388,38 398,38 390,44 393,54 385,48 377,54 380,44 372,38 382,38"
                   fill="#f0c040" opacity=".9" transform="scale(.8) translate(95,5)"/>
          <!-- Medina mosque silhouette -->
          <g transform="translate(0,160)">
            <rect x="30"  y="60" width="340" height="80" fill="#0d1f2d"/>
            <!-- green dome -->
            <path d="M175,60 Q200,20 225,60 Z" fill="#1a6b4a"/>
            <ellipse cx="200" cy="59" rx="25" ry="7" fill="#1a6b4a"/>
            <!-- dome top -->
            <line x1="200" y1="18" x2="200" y2="4"   stroke="#c9960c" stroke-width="2.5"/>
            <circle cx="200" cy="2" r="4" fill="#f0c040"/>
            <path d="M196,-1 Q200,-8 204,-1" fill="none" stroke="#f0c040" stroke-width="2"/>
            <!-- minarets -->
            <rect x="70"  y="18" width="16" height="65" fill="#162030"/>
            <path d="M70,18 Q78,4 86,18 Z" fill="#1a6b4a"/>
            <line x1="78" y1="2" x2="78" y2="-6"  stroke="#c9960c" stroke-width="2"/>
            <circle cx="78" cy="-7" r="3.5" fill="#f0c040"/>
            <rect x="314" y="18" width="16" height="65" fill="#162030"/>
            <path d="M314,18 Q322,4 330,18 Z" fill="#1a6b4a"/>
            <line x1="322" y1="2" x2="322" y2="-6" stroke="#c9960c" stroke-width="2"/>
            <circle cx="322" cy="-7" r="3.5" fill="#f0c040"/>
            <!-- windows glowing -->
            <ellipse cx="168" cy="105" rx="10" ry="7" fill="#f0c040" opacity=".4"/>
            <ellipse cx="200" cy="103" rx="10" ry="7" fill="#f0c040" opacity=".5"/>
            <ellipse cx="232" cy="105" rx="10" ry="7" fill="#f0c040" opacity=".4"/>
            <!-- Arches -->
            <path d="M100,105 Q112,90 124,105" fill="none" stroke="#c9960c" stroke-width="1.5" opacity=".5"/>
            <path d="M136,105 Q148,90 160,105" fill="none" stroke="#c9960c" stroke-width="1.5" opacity=".5"/>
            <path d="M240,105 Q252,90 264,105" fill="none" stroke="#c9960c" stroke-width="1.5" opacity=".5"/>
            <path d="M276,105 Q288,90 300,105" fill="none" stroke="#c9960c" stroke-width="1.5" opacity=".5"/>
          </g>
          <!-- Doves -->
          <path d="M100,110 Q110,98 122,106 Q130,96 140,104" fill="white" opacity=".6" stroke="none"/>
          <path d="M260,95  Q270,83 282,91  Q290,81 300,89"  fill="white" opacity=".55" stroke="none"/>
          <!-- Islamic pattern hints -->
          <g opacity=".06">
            <polygon points="200,60 210,85 236,85 215,101 223,127 200,111 177,127 185,101 164,85 190,85"
                     fill="#f0c040"/>
          </g>
        </svg>
