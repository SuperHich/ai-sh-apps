<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dawudBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#060810"/>
              <stop offset="50%" stop-color="#0e1020"/>
              <stop offset="100%" stop-color="#1a2808"/>
            </linearGradient>
            <radialGradient id="dawudGlow" cx="40%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f0c040" stop-opacity=".3"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#dawudBg)"/>
          <rect width="400" height="300" fill="url(#dawudGlow)"/>
          <!-- stars -->
          <circle cx="40" cy="25" r="2" fill="#f0c040" opacity=".9"/>
          <circle cx="95" cy="38" r="1.5" fill="white" opacity=".7"/>
          <circle cx="155" cy="15" r="2" fill="white" opacity=".8"/>
          <circle cx="250" cy="28" r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="320" cy="18" r="2" fill="white" opacity=".6"/>
          <circle cx="370" cy="42" r="1.5" fill="#f0c040" opacity=".8"/>
          <!-- Moon -->
          <circle cx="345" cy="55" r="22" fill="#ffe8a0" opacity=".7"/>
          <circle cx="355" cy="46" r="18" fill="#060810"/>
          <!-- Green hills of Israel -->
          <polygon points="0,230 70,190 150,215 240,180 330,205 400,185 400,300 0,300" fill="#2a4a10" opacity=".85"/>
          <rect x="0" y="250" width="400" height="50" fill="#1a2808" opacity=".8"/>
          <!-- Sheep -->
          <g opacity=".6">
            <ellipse cx="80" cy="248" rx="14" ry="8" fill="white"/>
            <circle cx="68" cy="242" r="8" fill="white"/>
            <ellipse cx="310" cy="250" rx="12" ry="7" fill="white"/>
            <circle cx="300" cy="244" r="7" fill="white"/>
          </g>
          <!-- Dawud figure with harp and sling -->
          <g transform="translate(200,195)">
            <circle cx="0" cy="-15" r="50" fill="#f0c040" opacity=".08"/>
            <path d="M-22,10 Q-18,68 0,72 Q18,68 22,10 Z" fill="#1e6b3a"/>
            <path d="M-34,6 Q-26,70 -8,74 Q-16,64 -22,10 Z" fill="#8b5e3c" opacity=".7"/>
            <!-- arm left — harp -->
            <line x1="-22" y1="14" x2="-55" y2="0" stroke="#1e6b3a" stroke-width="8" stroke-linecap="round"/>
            <!-- lyre -->
            <g transform="translate(-62,0)">
              <path d="M-10,-12 Q-16,0 -10,12 L10,12 Q16,0 10,-12 Z" fill="#8b5e3c" opacity=".9"/>
              <path d="M-10,-12 Q0,-18 10,-12" fill="none" stroke="#8b5e3c" stroke-width="3"/>
              <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#f5e6c8" stroke-width="1" opacity=".8"/>
              <line x1="-2" y1="-12" x2="-2" y2="12" stroke="#f5e6c8" stroke-width="1" opacity=".8"/>
              <line x1="2" y1="-12" x2="2" y2="12" stroke="#f5e6c8" stroke-width="1" opacity=".8"/>
              <line x1="6" y1="-10" x2="6" y2="10" stroke="#f5e6c8" stroke-width="1" opacity=".8"/>
              <circle cx="0" cy="0" r="14" fill="#f0c040" opacity=".12"/>
            </g>
            <!-- arm right — sling -->
            <line x1="22" y1="14" x2="58" y2="-5" stroke="#1e6b3a" stroke-width="8" stroke-linecap="round"/>
            <path d="M55,-6 Q65,-15 60,-22" stroke="#8b5e3c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="60" cy="-23" r="4" fill="#5a3a18" opacity=".8"/>
            <!-- head -->
            <circle cx="0" cy="-12" r="17" fill="#c8906a"/>
            <path d="M-14,-24 Q0,-42 14,-24 L16,-8 Q0,-5 -16,-8 Z" fill="#8b5e3c"/>
            <circle cx="-5.5" cy="-14" r="2.5" fill="#1a1a1a"/>
            <circle cx="5.5" cy="-14" r="2.5" fill="#1a1a1a"/>
            <path d="M-5,-5 Q0,0 5,-5" stroke="#7a3a10" stroke-width="1.8" fill="none"/>
          </g>
          <!-- Musical notes -->
          <g fill="#f0c040" opacity=".5" font-size="16" font-family="serif">
            <text x="100" y="178">♪</text>
            <text x="280" y="170">♫</text>
            <text x="150" y="155">♩</text>
            <text x="240" y="150">♪</text>
          </g>
          <!-- Birds -->
          <g opacity=".6">
            <path d="M60,170 Q70,158 82,168 Q90,156 100,164" fill="white" stroke="none"/>
            <path d="M300,160 Q310,148 322,158 Q330,146 340,154" fill="white" stroke="none"/>
          </g>
        </svg>
