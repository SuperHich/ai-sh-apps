<?xml version="1.0" encoding="UTF-8"?>
<svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rachidBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#060810"/>
              <stop offset="50%" stop-color="#0e0a1a"/>
              <stop offset="100%" stop-color="#3a2808"/>
            </linearGradient>
            <radialGradient id="rachidGlow" cx="50%" cy="45%" r="50%">
              <stop offset="0%" stop-color="#f0c040" stop-opacity=".3"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="url(#rachidBg)"/>
          <rect width="400" height="300" fill="url(#rachidGlow)"/>
          <!-- stars -->
          <circle cx="35" cy="20" r="2" fill="#f0c040" opacity=".9"/>
          <circle cx="95" cy="35" r="1.5" fill="white" opacity=".7"/>
          <circle cx="160" cy="15" r="2" fill="white" opacity=".8"/>
          <circle cx="260" cy="30" r="1.5" fill="#f0c040" opacity=".7"/>
          <circle cx="330" cy="18" r="2" fill="white" opacity=".6"/>
          <circle cx="375" cy="42" r="1.5" fill="#f0c040" opacity=".8"/>
          <!-- Crescent moon -->
          <circle cx="340" cy="55" r="22" fill="#ffe8a0" opacity=".7"/>
          <circle cx="350" cy="46" r="18" fill="#060810"/>
          <!-- Baghdad palace silhouette -->
          <g transform="translate(0,155)">
            <rect x="80" y="50" width="240" height="90" fill="#1a1030"/>
            <!-- Central dome -->
            <path d="M160,50 Q200,10 240,50 Z" fill="#1a3a6c"/>
            <ellipse cx="200" cy="49" rx="40" ry="8" fill="#1a3a6c"/>
            <line x1="200" y1="8" x2="200" y2="-4" stroke="#f0c040" stroke-width="2.5"/>
            <circle cx="200" cy="-6" r="4" fill="#f0c040"/>
            <!-- Minarets -->
            <rect x="95" y="15" width="14" height="55" fill="#162030"/>
            <path d="M95,15 Q102,2 109,15 Z" fill="#1a3a6c"/>
            <line x1="102" y1="0" x2="102" y2="-8" stroke="#f0c040" stroke-width="2"/>
            <circle cx="102" cy="-9" r="3" fill="#f0c040"/>
            <rect x="291" y="15" width="14" height="55" fill="#162030"/>
            <path d="M291,15 Q298,2 305,15 Z" fill="#1a3a6c"/>
            <line x1="298" y1="0" x2="298" y2="-8" stroke="#f0c040" stroke-width="2"/>
            <circle cx="298" cy="-9" r="3" fill="#f0c040"/>
            <!-- Windows glowing -->
            <ellipse cx="170" cy="100" rx="10" ry="7" fill="#f0c040" opacity=".4"/>
            <ellipse cx="200" cy="98" rx="10" ry="7" fill="#f0c040" opacity=".5"/>
            <ellipse cx="230" cy="100" rx="10" ry="7" fill="#f0c040" opacity=".4"/>
            <!-- Arches -->
            <path d="M120,105 Q132,90 144,105" fill="none" stroke="#f0c040" stroke-width="1.5" opacity=".5"/>
            <path d="M256,105 Q268,90 280,105" fill="none" stroke="#f0c040" stroke-width="1.5" opacity=".5"/>
          </g>
          <!-- Caliph figure -->
          <g transform="translate(200,120)">
            <circle cx="0" cy="-14" r="28" fill="#f0c040" opacity=".1"/>
            <path d="M-20,10 Q-16,60 0,64 Q16,60 20,10 Z" fill="#1a3a6c"/>
            <line x1="-20" y1="14" x2="-42" y2="6" stroke="#1a3a6c" stroke-width="8" stroke-linecap="round"/>
            <line x1="20" y1="14" x2="42" y2="6" stroke="#1a3a6c" stroke-width="8" stroke-linecap="round"/>
            <circle cx="0" cy="-14" r="16" fill="#c8906a"/>
            <!-- Turban -->
            <ellipse cx="0" cy="-24" rx="16" ry="12" fill="white" opacity=".9"/>
            <circle cx="0" cy="-30" r="4" fill="#f0c040"/>
            <!-- Eyes -->
            <circle cx="-5" cy="-14" r="2.5" fill="#1a1a1a"/>
            <circle cx="5" cy="-14" r="2.5" fill="#1a1a1a"/>
            <!-- Beard -->
            <ellipse cx="0" cy="-3" rx="5" ry="4" fill="#3a2808" opacity=".7"/>
          </g>
          <!-- Lantern (left) -->
          <g transform="translate(70,130)" opacity=".7">
            <rect x="-5" y="0" width="10" height="20" fill="#f0c040" opacity=".3" rx="2"/>
            <rect x="-3" y="-4" width="6" height="4" fill="#8b5e1a"/>
            <circle cx="0" cy="10" r="4" fill="#ffe8a0" opacity=".6"/>
          </g>
          <!-- Lantern (right) -->
          <g transform="translate(330,130)" opacity=".7">
            <rect x="-5" y="0" width="10" height="20" fill="#f0c040" opacity=".3" rx="2"/>
            <rect x="-3" y="-4" width="6" height="4" fill="#8b5e1a"/>
            <circle cx="0" cy="10" r="4" fill="#ffe8a0" opacity=".6"/>
          </g>
        </svg>
